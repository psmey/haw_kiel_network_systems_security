---
- name: Install dnsmasq
  become: true
  ansible.builtin.apt:
    name: dnsmasq
    state: present
    update_cache: true

- name: Disable systemd-resolved to free port 53
  become: true
  ansible.builtin.systemd:
    name: systemd-resolved
    state: stopped
    enabled: false

- name: Ensure resolv.conf points to dnsmasq
  become: true
  ansible.builtin.copy:
    content: "nameserver 127.0.0.1\n"
    dest: /etc/resolv.conf
    owner: root
    group: root
    mode: "0644"

- name: Configure dnsmasq
  become: true
  ansible.builtin.template:
    src: dnsmasq.conf.j2
    dest: /etc/dnsmasq.conf
    owner: root
    group: root
    mode: "0644"

- name: Ensure dnsmasq is running
  become: true
  ansible.builtin.service:
    name: dnsmasq
    state: restarted
    enabled: true
