---
- name: Update apt cache
  become: true
  ansible.builtin.apt:
    update_cache: true

- name: Install Ubuntu Desktop
  become: true
  ansible.builtin.apt:
    name: ubuntu-desktop
    state: present

- name: Enable graphical target
  become: true
  ansible.builtin.command: systemctl set-default graphical.target
  changed_when: false
