---
- name: Ensure UFW is installed
  become: true
  ansible.builtin.apt:
    name: ufw
    state: present
    update_cache: true

- name: Reset UFW to a clean state
  become: true
  ansible.builtin.command: ufw --force reset
  changed_when: false

- name: Default deny all incoming
  become: true
  community.general.ufw:
    direction: incoming
    policy: deny

- name: Allow outgoing traffic
  become: true
  community.general.ufw:
    direction: outgoing
    policy: allow

- name: Allow selected ports
  become: true
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: "{{ ufw_allowed_ports }}"

- name: Enable UFW
  become: true
  community.general.ufw:
    state: enabled
