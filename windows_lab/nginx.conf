worker_processes auto;

events {
    worker_connections 768;
}

http {
    include mime.types;
    default_type application/octet-stream;

    access_log C:\\tools\\nginx-1.29.3\\logs\\access.log;
    error_log C:\\tools\\nginx-1.29.3\\logs\\error.log;

    # HTTP Sever
    server {
        listen 80;
        server_name _;

        # Redirect all HTTP traffic to HTTPS
        return 301 https://$host$request_uri;
    }

    # HTTPS server
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate C:\\tools\\nginx-1.29.3\\ssl\\server.lab.crt;
        ssl_certificate_key C:\\tools\\nginx-1.29.3\\ssl\\server.lab.key;

        # Enable HSTS
        add_header Strict-Transport-Security "max-age=31536000" always;

        root C:\\tools\\nginx-1.29.3\\html;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
