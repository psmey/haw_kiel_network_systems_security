services:
  app:
    image: nginx:1.29.4-alpine
    restart: always
    networks:
      crowdsec:

  reverse-proxy:
    image: owasp/modsecurity-crs:4.21.0-nginx-alpine-202512071012
    restart: always
    ports:
      - 8080:8080
    environment:
      BACKEND: http://app:80
      PORT: 8080
      LOGLEVEL: info
    depends_on:
      - 'app'
    networks:
      crowdsec:

  crowdsec:
    image: crowdsecurity/crowdsec
    restart: always
    networks:
      crowdsec:
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      COLLECTIONS: "crowdsecurity/nginx"
    depends_on:
      - 'reverse-proxy'
    volumes:
      ## Bad pratice to mount docker socket into a container
      - /var/run/docker.sock:/var/run/docker.sock:ro
      ######################################################
      - ./crowdsec/acquis.yaml:/etc/crowdsec/acquis.yaml
      - crowdsec-db:/var/lib/crowdsec/data/
      - crowdsec-config:/etc/crowdsec/

